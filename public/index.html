<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5254E8" />
  <title>Pickwise — Smarter Picks. Every Time.</title>
  <meta name="description" content="Ask anything. Get the 3 best options near you and 3 best in the world. AI-powered recommendations for products, services and places. Free. Private. Instant." />
  <link rel="canonical" href="https://pickwise.com" />
  <meta property="og:title" content="Pickwise — Smarter picks. Every time." />
  <meta property="og:description" content="3 best near you. 3 best in the world. AI-powered. Free." />
  <meta property="og:image" content="https://pickwise.com/og-image.png" />
  <meta property="og:url" content="https://pickwise.com" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pickwise" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pickwise — AI Recommendations: 3 near you + 3 worldwide" />
  <meta name="twitter:description" content="Ask anything. Get the 6 best answers instantly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Pickwise",
    "url": "https://pickwise.com",
    "description": "AI-powered recommendation engine — 3 best near you + 3 best worldwide",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://pickwise.com/results?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Pickwise",
      "url": "https://pickwise.com"
    }
  }
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run Pickwise.</noscript>
  <div id="root"></div>
</body>
</html>
